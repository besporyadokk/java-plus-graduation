version: '3.8'

x-common-variables: &common-variables
  SPRING_PROFILES_ACTIVE: docker
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  EUREKA_INSTANCE_INSTANCE_ID: "${COMPOSE_PROJECT_NAME}-${SERVICE_NAME}:${RANDOM}"
  CONFIG_SERVER_URL: http://config-server:8888
  SPRING_DATASOURCE_USERNAME: dbuser
  SPRING_DATASOURCE_PASSWORD: 12345

services:
  discovery-server:
    build: ./infra/discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    environment:
      SERVICE_NAME: discovery-server
    restart: unless-stopped

  config-server:
    build: ./infra/config-server
    container_name: config-server
    environment:
      SPRING_PROFILES_ACTIVE: native
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SERVICE_NAME: config-server
    depends_on:
      discovery-server:
        condition: service_started
    restart: unless-stopped

  stats-db:
    image: postgres:16.1
    container_name: stats-db
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    volumes:
      - stats-db-data:/var/lib/postgresql/data
      - ./stats-db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d stats"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-db:
    image: postgres:16.1
    container_name: core-db
    environment:
      POSTGRES_DB: core_services
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    ports:
      - "5433:5432"
    volumes:
      - core-db-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d core_services"]
      interval: 10s
      timeout: 5s
      retries: 5

  stats-server:
    build:
      context: ./stats-service/stats-server
      dockerfile: Dockerfile
    container_name: stats-server
    environment:
      <<: *common-variables
      SERVICE_NAME: stats-server
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/stats
    ports:
      - "9090:9090"
    depends_on:
      stats-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      config-server:
        condition: service_started
    restart: unless-stopped

  user-service:
    build:
      context: ./core/user-service
      dockerfile: Dockerfile
    container_name: user-service
    environment:
      <<: *common-variables
      SERVICE_NAME: user-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://core-db:5432/userdb
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      core-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      config-server:
        condition: service_started
    restart: unless-stopped

  category-service:
    build:
      context: ./core/category-service
      dockerfile: Dockerfile
    container_name: category-service
    environment:
      <<: *common-variables
      SERVICE_NAME: category-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://core-db:5432/categorydb
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      core-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      config-server:
        condition: service_started
    restart: unless-stopped

  event-service:
    build:
      context: ./core/event-service
      dockerfile: Dockerfile
    container_name: event-service
    environment:
      <<: *common-variables
      SERVICE_NAME: event-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://core-db:5432/eventdb
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      core-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      config-server:
        condition: service_started
    restart: unless-stopped

  request-service:
    build:
      context: ./core/request-service
      dockerfile: Dockerfile
    container_name: request-service
    environment:
      <<: *common-variables
      SERVICE_NAME: request-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://core-db:5432/requestdb
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      core-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      config-server:
        condition: service_started
    restart: unless-stopped

  compilation-service:
    build:
      context: ./core/compilation-service
      dockerfile: Dockerfile
    container_name: compilation-service
    environment:
      <<: *common-variables
      SERVICE_NAME: compilation-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://core-db:5432/compilationdb
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      core-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      config-server:
        condition: service_started
    restart: unless-stopped

  comment-service:
    build:
      context: ./core/comment-service
      dockerfile: Dockerfile
    container_name: comment-service
    environment:
      <<: *common-variables
      SERVICE_NAME: comment-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://core-db:5432/commentdb
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      core-db:
        condition: service_healthy
      discovery-server:
        condition: service_started
      config-server:
        condition: service_started
    restart: unless-stopped

  gateway-server:
    build:
      context: ./infra/gateway-server
      dockerfile: Dockerfile
    container_name: gateway-server
    ports:
      - "8080:8080"
    environment:
      <<: *common-variables
      SERVICE_NAME: gateway-server
    depends_on:
      discovery-server:
        condition: service_started
      config-server:
        condition: service_started
    restart: unless-stopped

  # --- KAFKA ---
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:latest
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic stats.user-actions.v1 --partitions 1 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic stats.events-similarity.v1 --partitions 1 --replication-factor 1
      "
    restart: "no"

  collector:
    build:
      context: ./stats-service/telemetry/collector
      dockerfile: Dockerfile
    container_name: collector
    environment:
      <<: *common-variables
      SERVICE_NAME: collector
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  aggregator:
    build:
      context: ./stats-service/telemetry/aggregator
      dockerfile: Dockerfile
    container_name: aggregator
    environment:
      <<: *common-variables
      SERVICE_NAME: aggregator
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  analyzer:
    build:
      context: ./stats-service/telemetry/analyzer
      dockerfile: Dockerfile
    container_name: analyzer
    environment:
      <<: *common-variables
      SERVICE_NAME: analyzer
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/analyzerdb
      SPRING_DATASOURCE_USERNAME: dbuser
      SPRING_DATASOURCE_PASSWORD: 12345
    depends_on:
      stats-db:
        condition: service_healthy
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  stats-db-data:
  core-db-data: