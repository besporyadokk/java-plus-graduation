server:
  port: 8080

spring:
  application:
    name: gateway-server

  cloud:
    config:
      discovery:
        enabled: true

    gateway:
      discovery:
        locator:
          enabled: true  # автоматическое создание маршрутов для зарегистрированных сервисов

      routes:
        # Маршруты для Admin контроллеров
        - id: admin-categories-route
          uri: lb://category-service
          predicates:
            - Path=/admin/categories/**
          filters:
            - RewritePath=/admin/categories/(?<segment>.*), /admin/categories/$\{segment}

        - id: admin-compilations-route
          uri: lb://compilation-service
          predicates:
            - Path=/admin/compilations/**
          filters:
            - RewritePath=/admin/compilations/(?<segment>.*), /admin/compilations/$\{segment}

        - id: admin-events-route
          uri: lb://event-service
          predicates:
            - Path=/admin/events/**
          filters:
            - RewritePath=/admin/events/(?<segment>.*), /admin/events/$\{segment}

        - id: admin-comments-route                    # исправлено: review → comment
          uri: lb://comment-service
          predicates:
            - Path=/admin/comments/**                 # исправлено: reviews → comments
          filters:
            - RewritePath=/admin/comments/(?<segment>.*), /admin/comments/$\{segment}

        - id: admin-users-route
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**
          filters:
            - RewritePath=/admin/users/(?<segment>.*), /admin/users/$\{segment}

        # Маршруты для Private контроллеров
        - id: private-requests-route
          uri: lb://request-service
          predicates:
            - Path=/users/{userId}/requests/**, /users/{userId}/events/{eventId}/requests
          filters:
            - RewritePath=/users/(?<userId>\\d+)/(?<segment>.*), /users/$\{userId}/$\{segment}

        - id: private-events-route
          uri: lb://event-service
          predicates:
            - Path=/users/{userId}/events/**

        - id: private-comments-route                   # исправлено: review → comment
          uri: lb://comment-service
          predicates:
            - Path=/users/{userId}/comments/**        # исправлено: reviews → comments
          filters:
            - RewritePath=/users/(?<userId>\\d+)/comments/(?<segment>.*), /users/$\{userId}/comments/$\{segment}

        # Маршруты для Public контроллеров
        - id: public-categories-route
          uri: lb://category-service
          predicates:
            - Path=/categories/**
          filters:
            - RewritePath=/categories/(?<segment>.*), /categories/$\{segment}

        - id: public-compilations-route
          uri: lb://compilation-service
          predicates:
            - Path=/compilations/**
          filters:
            - RewritePath=/compilations/(?<segment>.*), /compilations/$\{segment}

        - id: public-events-route
          uri: lb://event-service
          predicates:
            - Path=/events/**
          filters:
            - RewritePath=/events/(?<segment>.*), /events/$\{segment}

        - id: public-comments-route                    # исправлено: review → comment
          uri: lb://comment-service
          predicates:
            - Path=/comments/**                       # исправлено: reviews → comments
          filters:
            - RewritePath=/comments/(?<segment>.*), /comments/$\{segment}

management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,gateway