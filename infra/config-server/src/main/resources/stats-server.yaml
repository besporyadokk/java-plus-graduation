server:
  port: 0

spring:
  application:
    name: stats-server
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:statsdb
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: always

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    ru.practicum: DEBUG